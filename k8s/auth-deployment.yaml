apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/mkmuduli/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9005
          env:
            - name: AUTH_DB_URL
              value: jdbc:postgresql://postgres:5432/ecom_auth_db
            - name: AUTH_DB_USERNAME
              value: postgres
            - name: AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecom-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecom-secrets
                  key: JWT_SECRET
          readinessProbe:
            tcpSocket:
              port: 9005
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9005
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ecommerce
spec:
  selector:
    app: auth-service
  ports:
    - port: 9005
      targetPort: 9005
