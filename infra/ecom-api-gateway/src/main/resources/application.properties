server.port=8080
spring.application.name=ecom-api-gateway
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Redis connection used by Spring Cloud Gateway's RedisRateLimiter
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Framework error responses stay generic if Redis is unavailable.
server.error.include-message=never
server.error.include-stacktrace=never

# API token bucket defaults: 10 requests/second, with a burst of 20.
gateway.rate-limit.replenish-rate=${GATEWAY_RATE_LIMIT_REPLENISH_RATE:10}
gateway.rate-limit.burst-capacity=${GATEWAY_RATE_LIMIT_BURST_CAPACITY:20}

# Public auth endpoints use a tighter IP-based bucket to reduce credential abuse.
gateway.auth-rate-limit.replenish-rate=${GATEWAY_AUTH_RATE_LIMIT_REPLENISH_RATE:2}
gateway.auth-rate-limit.burst-capacity=${GATEWAY_AUTH_RATE_LIMIT_BURST_CAPACITY:5}

# Authentication service
spring.cloud.gateway.server.webflux.routes[4].id=auth-service
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:9005
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/auth/**
spring.cloud.gateway.server.webflux.routes[4].order=10

# Product
spring.cloud.gateway.server.webflux.routes[0].id=product-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:9001
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/product/**
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.key-resolver=#{@userKeyResolver}
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.replenishRate=${gateway.rate-limit.replenish-rate}
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=${gateway.rate-limit.burst-capacity}

# Order
spring.cloud.gateway.server.webflux.routes[1].id=order-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:9004
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/order/**
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.key-resolver=#{@userKeyResolver}
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.redis-rate-limiter.replenishRate=${gateway.rate-limit.replenish-rate}
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.redis-rate-limiter.burstCapacity=${gateway.rate-limit.burst-capacity}

# Inventory
spring.cloud.gateway.server.webflux.routes[2].id=inventory-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:9002
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/inventory/**
spring.cloud.gateway.server.webflux.routes[2].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.key-resolver=#{@userKeyResolver}
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.redis-rate-limiter.replenishRate=${gateway.rate-limit.replenish-rate}
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.redis-rate-limiter.burstCapacity=${gateway.rate-limit.burst-capacity}

# Payment
spring.cloud.gateway.server.webflux.routes[3].id=payment-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:9003
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/payment/**
spring.cloud.gateway.server.webflux.routes[3].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.key-resolver=#{@userKeyResolver}
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.redis-rate-limiter.replenishRate=${gateway.rate-limit.replenish-rate}
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.redis-rate-limiter.burstCapacity=${gateway.rate-limit.burst-capacity}

# Login/signup are public and use a separate, tighter IP-based limiter.
spring.cloud.gateway.server.webflux.routes[5].id=auth-login-rate-limited
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:9005
spring.cloud.gateway.server.webflux.routes[5].order=-1
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/auth/login,/auth/login/
spring.cloud.gateway.server.webflux.routes[5].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[5].filters[0].args.key-resolver=#{@clientIpKeyResolver}
spring.cloud.gateway.server.webflux.routes[5].filters[0].args.redis-rate-limiter.replenishRate=${gateway.auth-rate-limit.replenish-rate}
spring.cloud.gateway.server.webflux.routes[5].filters[0].args.redis-rate-limiter.burstCapacity=${gateway.auth-rate-limit.burst-capacity}

spring.cloud.gateway.server.webflux.routes[6].id=auth-signup-rate-limited
spring.cloud.gateway.server.webflux.routes[6].uri=http://localhost:9005
spring.cloud.gateway.server.webflux.routes[6].order=-1
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/auth/signup,/auth/signup/
spring.cloud.gateway.server.webflux.routes[6].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[6].filters[0].args.key-resolver=#{@clientIpKeyResolver}
spring.cloud.gateway.server.webflux.routes[6].filters[0].args.redis-rate-limiter.replenishRate=${gateway.auth-rate-limit.replenish-rate}
spring.cloud.gateway.server.webflux.routes[6].filters[0].args.redis-rate-limiter.burstCapacity=${gateway.auth-rate-limit.burst-capacity}
