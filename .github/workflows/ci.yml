name: Java CI

on:
  push:
    branches:
      - main

jobs:
  
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven Test
        run: mvn clean test

      - name: Maven Package
        run: mvn package -DskipTests

      - name: Check built JARs
        run: |
          find . -name "*.jar" -type f
      
      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: application-jars
          path: |
            web-service/*/target/*.jar
            infra/*/target/*.jar

  docker:
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - product
          - inventory
          - order
          - payment
          - gateway
          - auth

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JARs
        uses: actions/download-artifact@v4
        with:
          name: application-jars

      - name: Build Docker Image
        run: docker build -f Dockerfile.${{matrix.service}} -t ${{ matrix.service }}-service:latest .

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        run: |
          docker tag ${{ matrix.service }}-service:latest ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}-service:latest
          docker push ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}-service:latest