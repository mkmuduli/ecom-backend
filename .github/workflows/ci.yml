name: Java CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven Test
        run: mvn clean test
      
      - name: Maven Package
        run: mvn package -DskipTests  

      - name: Build Product Image
        run: docker build -f Dockerfile.product -t product-service:latest .

      - name: Build Inventory Image
        run: docker build -f Dockerfile.inventory -t inventory-service:latest .

      - name: Build Order Image
        run: docker build -f Dockerfile.order -t order-service:latest .

      - name: Build Payment Image
        run: docker build -f Dockerfile.payment -t payment-service:latest .

      - name: Build Gateway Image
        run: docker build -f Dockerfile.gateway -t gateway:latest .

      - name: Build Auth Image
        run: docker build -f Dockerfile.auth -t auth:latest .

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Product Image
        run: |
          docker tag product-service:latest ghcr.io/${{ github.repository_owner }}/product-service:latest
          docker push ghcr.io/${{ github.repository_owner }}/product-service:latest

      - name: Push Inventory Image
        run: |
          docker tag inventory-service:latest ghcr.io/${{ github.repository_owner }}/inventory-service:latest
          docker push ghcr.io/${{ github.repository_owner }}/inventory-service:latest

      - name: Push Order Image
        run: |
          docker tag order-service:latest ghcr.io/${{ github.repository_owner }}/order-service:latest
          docker push ghcr.io/${{ github.repository_owner }}/order-service:latest

      - name: Push Payment Image
        run: |
          docker tag payment-service:latest ghcr.io/${{ github.repository_owner }}/payment-service:latest
          docker push ghcr.io/${{ github.repository_owner }}/payment-service:latest

      - name: Push Gateway Image
        run: |
          docker tag gateway:latest ghcr.io/${{ github.repository_owner }}/gateway:latest
          docker push ghcr.io/${{ github.repository_owner }}/gateway:latest

      - name: Push Auth Image
        run: |
          docker tag auth:latest ghcr.io/${{ github.repository_owner }}/auth:latest
          docker push ghcr.io/${{ github.repository_owner }}/auth:latest